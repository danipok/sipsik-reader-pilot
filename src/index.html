<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf5">
<meta name="color-scheme" content="light">
<title>Sipsik · Reader pilot</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <section id="home" class="home" aria-label="Sipsik home">
    <div class="home-shell">
      <div class="home-cover-wrap">
        <img id="coverArt" class="cover-art" src="./assets/cover.png" alt="Sipsik book cover illustration">
      </div>
      <div class="home-panel">
        <div class="door-stack" aria-label="Choose Sipsik experience">
          <button type="button" class="cover-door" data-section="digital"><span class="door-title" id="digitalDoorTitle">Sipsik</span><span class="door-copy" id="digitalDoorCopy">The original stories</span></button>
          <button type="button" class="cover-door" data-section="adventures"><span class="door-title" id="adventuresDoorTitle">Sipsik’s New Adventures</span><span class="door-copy" id="adventuresDoorCopy">Read new stories. Create the next one.</span></button>
          <button type="button" class="cover-door" data-section="original"><span class="door-title" id="originalDoorTitle">Original</span><span class="door-copy" id="originalDoorCopy">The original physical book</span></button>
        </div>
        <div class="home-language"><label id="globalLanguageLabel" for="globalLanguage">Language</label><select id="globalLanguage" aria-label="Language"><option value="en">English</option><option value="et">Eesti</option></select></div>
      </div>
    </div>
  </section>

  <section id="opening" class="opening" hidden aria-label="Sipsik book opening">
    <button class="opening-home" id="openingHome" type="button">Home</button>
    <div class="opening-art-wrap"><img class="opening-art" src="./assets/open.jpg" alt="Sipsik on the first illustrated front-matter page"></div>
    <div class="opening-panel">
      <div class="opening-copy"><div class="eyebrow" id="openingEyebrow">SIPSIK</div><h1 id="openingTitle">Digital reader</h1></div>
      <div class="choice-row"><label class="choice-label" id="storyLabel" for="bookLanguage">Story &amp; narration</label><select class="choice-button" id="bookLanguage" aria-describedby="pilotNote"></select></div>
      <div class="choice-row theme-row" hidden><span class="choice-label" id="surfaceLabel">Reading surface</span><div class="theme-choices" role="radiogroup" aria-label="Reading surface">
        <button class="theme-dot" data-theme="white" type="button" role="radio" aria-label="White"></button><button class="theme-dot" data-theme="ivory" type="button" role="radio" aria-label="Warm white"></button><button class="theme-dot" data-theme="paper" type="button" role="radio" aria-label="Soft cream"></button><button class="theme-dot" data-theme="gray" type="button" role="radio" aria-label="Very light warm gray"></button>
      </div></div>
      <p class="pilot-note" id="pilotNote">Only the verified Estonian story and narration text is populated in this pilot.</p>
      <button class="primary-open" id="openBook" type="button">Open book</button>
    </div>
  </section>

  <section id="reader" class="reader" hidden aria-label="Sipsik reader">
    <div class="reader-corner-zone reader-corner-zone-left" id="readerBackHotspot" aria-hidden="true">
      <button type="button" class="reader-corner-button reader-back-button" id="readerBackButton" aria-label="Back to book opening">‹</button>
    </div>
    <div class="reader-corner-zone reader-corner-zone-right" id="readerMoreHotspot" aria-hidden="true">
      <button type="button" class="reader-corner-button reader-more-button" id="readerMoreButton" aria-label="Reader options" aria-expanded="false" aria-controls="readerQuickMenu">•••</button>
    </div>
    <div class="reader-quick-menu" id="readerQuickMenu" hidden aria-label="Reader options">
      <button type="button" class="quick-icon-button" id="quickTextButton" aria-label="Text size">Aa</button>
      <button type="button" class="quick-icon-button" id="quickVoiceButton" aria-label="Listen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4zm12.5-2.5a6 6 0 0 1 0 9M18.8 5a9.3 9.3 0 0 1 0 14"/></svg>
      </button>
      <button type="button" class="quick-icon-button" id="quickBackgroundButton" aria-label="Reading background">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      </button>
    </div>
    <div class="reader-quick-submenu reader-text-submenu" id="readerTextSubmenu" hidden>
      <button type="button" id="quickTextSmaller" aria-label="Smaller text">A−</button><output id="quickTextValue">100%</output><button type="button" id="quickTextLarger" aria-label="Larger text">A+</button>
    </div>
    <div class="reader-quick-submenu reader-background-submenu" id="readerBackgroundSubmenu" hidden aria-label="Reading background">
      <button class="quick-theme-dot" data-quick-theme="white" type="button" aria-label="White"></button>
      <button class="quick-theme-dot" data-quick-theme="ivory" type="button" aria-label="Warm white"></button>
      <button class="quick-theme-dot" data-quick-theme="paper" type="button" aria-label="Soft cream"></button>
      <button class="quick-theme-dot" data-quick-theme="gray" type="button" aria-label="Very light warm gray"></button>
    </div>
    <div class="art-stage" id="artStage" aria-live="polite"><img id="currentArt" class="current-art" src="./assets/c01-a.jpg" alt=""></div>
    <main id="storyScroller" class="story-scroller" tabindex="0" aria-label="Story text"><article id="story" class="story"></article></main>
    <footer class="reader-footer" aria-label="Reader controls"><button type="button" class="footer-button home-button" id="readerHome" aria-label="Home">⌂</button><button type="button" class="footer-button" id="settingsButton" aria-label="Reading settings">Aa</button><div class="footer-position" id="positionLabel" aria-live="polite">Chapter 1 · c01-p001</div><button type="button" class="footer-button listen-button" id="listenButton" aria-label="Listen from current paragraph">Listen</button></footer>
  </section>

  <section id="original" class="original" hidden aria-label="Original Sipsik book photographs">
    <header class="original-head"><button type="button" class="original-home" id="originalHome">Home</button><div><div class="eyebrow">SIPSIK</div><h1 id="originalTitle">Original · Chapters 1–3</h1></div></header>
    <main class="original-pages" id="originalPages">
      <figure class="original-page"><img src="./assets/original-05.jpg" alt="Original photographed Sipsik source spread 5" loading="eager"><figcaption>4–5</figcaption></figure>
      <figure class="original-page"><img src="./assets/original-06.jpg" alt="Original photographed Sipsik source spread 6" loading="lazy"><figcaption>6–9</figcaption></figure>
      <figure class="original-page"><img src="./assets/original-07.jpg" alt="Original photographed Sipsik source spread 7" loading="lazy"><figcaption>10–11</figcaption></figure>
      <figure class="original-page"><img src="./assets/original-08.jpg" alt="Original photographed Sipsik source spread 8" loading="lazy"><figcaption>12–13</figcaption></figure>
      <figure class="original-page"><img src="./assets/original-09.jpg" alt="Original photographed Sipsik source spread 9" loading="lazy"><figcaption>14–15</figcaption></figure>
      <figure class="original-page"><img src="./assets/original-10.jpg" alt="Original photographed Sipsik source spread 10" loading="lazy"><figcaption>16–17</figcaption></figure>
    </main>
  </section>
</div>

<dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle"><form method="dialog">
  <div class="dialog-head"><h2 id="settingsTitle">Reading settings</h2><button class="icon-close" value="cancel" aria-label="Close settings">×</button></div>
  <div class="setting-block"><span class="setting-title" id="textSizeTitle">Text size</span><div class="size-controls"><button type="button" id="smallerText" aria-label="Smaller text">A−</button><output id="sizeValue">100%</output><button type="button" id="largerText" aria-label="Larger text">A+</button></div></div>
  <div class="setting-block"><span class="setting-title" id="settingsSurfaceTitle">Reading surface</span><div class="theme-choices dialog-themes" role="radiogroup" aria-label="Reading surface"><button class="theme-dot" data-theme="white" type="button" role="radio" aria-label="White"></button><button class="theme-dot" data-theme="ivory" type="button" role="radio" aria-label="Warm white"></button><button class="theme-dot" data-theme="paper" type="button" role="radio" aria-label="Soft cream"></button><button class="theme-dot" data-theme="gray" type="button" role="radio" aria-label="Very light warm gray"></button></div></div>
  <button type="button" class="quiet-action" id="bookBeginning">Book beginning / language</button>
</form></dialog>

<section id="listenStage" class="listen-stage" hidden aria-label="Picture-first listening">
  <header class="listen-top"><div><div class="listen-kicker" id="listenKicker">Listening</div><div id="listenChapter" class="listen-chapter"></div></div><button type="button" id="showText" class="show-text">Show text</button></header>
  <div class="listen-visual"><img id="listenArt" class="listen-art" src="./assets/c01-a.jpg" alt=""></div>
  <div class="listen-meta"><span id="listenId">c01-p001</span><span id="listenCount">1 / 65</span></div>
  <div class="listen-controls"><button type="button" id="audioPrev" aria-label="Previous paragraph">‹</button><button type="button" id="audioToggle" class="audio-primary">Play</button><button type="button" id="audioStop" aria-label="Stop narration">Stop</button><button type="button" id="audioNext" aria-label="Next paragraph">›</button></div>
</section>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
<script type="module" src="./reader-chrome.js"></script>
</body>
</html>

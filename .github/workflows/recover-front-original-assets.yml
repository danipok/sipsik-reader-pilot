name: Recover locked SIPSIK front and Original assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-front-original-assets.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets /tmp/sipsik-transfer
          cat >/tmp/decode_sipsik_png.py <<'PY'
          import sys, struct, zlib, hashlib
          out=sys.argv[1]; expected_size=int(sys.argv[2]); expected_sha=sys.argv[3]
          specs=sys.argv[4:]
          result=bytearray()
          for spec in specs:
              path,want_len=spec.rsplit(':',1); want_len=int(want_len)
              b=open(path,'rb').read()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', path
              pos=8; width=height=None; ids=[]
              while pos<len(b):
                  n=struct.unpack('>I',b[pos:pos+4])[0]; typ=b[pos+4:pos+8]; dat=b[pos+8:pos+8+n]; pos += 12+n
                  if typ==b'IHDR': width,height,depth,color,comp,filt,inter=struct.unpack('>IIBBBBB',dat); assert depth==8 and color==2 and inter==0
                  elif typ==b'IDAT': ids.append(dat)
                  elif typ==b'IEND': break
              raw=zlib.decompress(b''.join(ids)); rowbytes=width*3; payload=bytearray(); off=0
              for _ in range(height):
                  assert raw[off]==0; off += 1; payload += raw[off:off+rowbytes]; off += rowbytes
              result += payload[:want_len]
          assert len(result)==expected_size,(len(result),expected_size)
          got=hashlib.sha256(result).hexdigest(); assert got==expected_sha,(got,expected_sha)
          open(out,'wb').write(result)
          print(out, len(result), got)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          curl --fail --location --silent --show-error --retry 3 'https://oaisdmntprseasia.blob.core.windows.net/files/00000000-a08c-8207-a1d9-5dde416af78b/raw?se=2026-09-06T09%3A57%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=d169970d-db8c-444b-9c37-84eff4c9dbb9&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T01%3A10%3A44Z&ske=2026-09-07T01%3A10%3A44Z&sks=b&skv=2026-02-06&sig=Jyxy6RKLpYX76jQWXGZHFaZtCuuFwdYPHS4kcLWqzQM%3D' -o src/assets/cover.png
          printf '%s  %s\n' '00be6356858b0568892d046e3d50baef87e4498548eedbedf512e426d53eaf57' 'src/assets/cover.png' | sha256sum -c -
          git add src/assets/cover.png
          git commit -m 'Add locked source-faithful front cover asset [skip ci]'
          git push


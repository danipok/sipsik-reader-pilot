name: Recover verified SIPSIK assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-verified-assets.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact verified assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets
          fetch_verified() {
            local out="$1"
            local expected="$2"
            local url="$3"
            curl --fail --location --silent --show-error --retry 3 "$url" -o "src/assets/$out"
            printf '%s  %s\n' "$expected" "src/assets/$out" | sha256sum -c -
          }
          fetch_verified 'c01-a.jpg' '119900be884bd46a51ff0ad275a6f095bc8e2a2a5c13e1e86c26b5d31ea0aa88' 'https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-b83c-8208-8d2b-83abd5ba3ef3/raw?se=2026-09-04T19%3A00%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=01a06da9-69d4-7356-8baf-cfba8ad74e24&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A20%3A55Z&ske=2026-09-05T03%3A20%3A55Z&sks=b&skv=2026-02-06&sig=rD%2BHwm0Xa3X%2BZNyQ5xiKS0omTHWzwrAGQo6%2BTjhhLrc%3D'

          fetch_verified 'c03-c.jpg' '1e581c8e1d9eb93d882e31f500712a23663c4ce9c699be943ed748bdb9708b29' 'https://oaisdmntprindiasocentral.blob.core.windows.net/files/00000000-bf94-8211-b556-b1b764e75391/raw?se=2026-09-04T19%3A01%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=01a06da9-69d4-7356-8baf-cfba8ad74e24&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A02%3A09Z&ske=2026-09-05T03%3A02%3A09Z&sks=b&skv=2026-02-06&sig=71bcWD2HJLxCNQKZTdSQSZfZVIiG%2BUc08nyJAdhDZGU%3D'
          fetch_verified 'open.jpg' 'f0bed4ab230886649871c7d174fa0c0d2d9c3b800c83251f8fb5f6873a64611a' 'https://oaisdmntprindiasocentral.blob.core.windows.net/files/00000000-1ed4-8211-a311-bca629bc089f/raw?se=2026-09-04T19%3A01%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=01a06da9-69d4-7356-8baf-cfba8ad74e24&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A09%3A43Z&ske=2026-09-05T03%3A09%3A43Z&sks=b&skv=2026-02-06&sig=pIl3fm0L73mrBydvs1J/GHdcoW4ocnWQHEVb%2BH65LUA%3D'
      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets
          if git diff --cached --quiet; then
            echo 'Assets already present.'
            exit 0
          fi
          git commit -m 'Recover exact verified SIPSIK assets [skip ci]'
          git push

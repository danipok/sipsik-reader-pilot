name: Recover locked SIPSIK source assets v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-front-original-assets-v2.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact assets and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets /tmp/sipsik
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cat >/tmp/decode.py <<'PY'
          import sys,struct,zlib,hashlib
          out=sys.argv[1]; size=int(sys.argv[2]); sha=sys.argv[3]; specs=sys.argv[4:]
          result=bytearray()
          for spec in specs:
              path,n=spec.rsplit(':',1); n=int(n); b=open(path,'rb').read(); assert b[:8]==b'\x89PNG\r\n\x1a\n'
              pos=8; ids=[]; w=h=None
              while pos<len(b):
                  L=struct.unpack('>I',b[pos:pos+4])[0]; typ=b[pos+4:pos+8]; dat=b[pos+8:pos+8+L]; pos+=12+L
                  if typ==b'IHDR': w,h,depth,color,_,_,inter=struct.unpack('>IIBBBBB',dat); assert depth==8 and color==2 and inter==0
                  elif typ==b'IDAT': ids.append(dat)
                  elif typ==b'IEND': break
              raw=zlib.decompress(b''.join(ids)); rowbytes=w*3; payload=bytearray(); p=0
              for _ in range(h):
                  assert raw[p]==0; p+=1; payload+=raw[p:p+rowbytes]; p+=rowbytes
              result+=payload[:n]
          assert len(result)==size,(len(result),size)
          got=hashlib.sha256(result).hexdigest(); assert got==sha,(got,sha)
          open(out,'wb').write(result); print(out,size,got)
          PY

          fetch(){ curl --fail --location --silent --show-error --retry 4 "$2" -o "$1"; }
          verify(){ printf '%s  %s\n' "$2" "$1" | sha256sum -c -; }
          commit_one(){ git add "$1"; git commit -m "$2 [skip ci]"; git push; }

          fetch src/assets/cover.png 'https://oaisdmntprindiasocentral.blob.core.windows.net/files/00000000-98a4-8211-b66d-b8d364682bd3/raw?se=2026-09-06T10%3A43%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=c658f5fa-d92f-462a-b0ee-d4c252620944&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T04%3A46%3A48Z&ske=2026-09-07T04%3A46%3A48Z&sks=b&skv=2026-02-06&sig=zojD/RZ6Y5nOqeE2tTaF4GCIFGDPPwEAPxdr13g0VwY%3D'
          verify src/assets/cover.png 00be6356858b0568892d046e3d50baef87e4498548eedbedf512e426d53eaf57
          commit_one src/assets/cover.png 'Add locked source-faithful front cover asset'

          recover(){
            n="$1"; size="$2"; sha="$3"; len2="$4"; u0="$5"; u1="$6"; u2="$7"; h0="$8"; h1="$9"; h2="${10}"
            fetch /tmp/sipsik/p0.png "$u0"; fetch /tmp/sipsik/p1.png "$u1"; fetch /tmp/sipsik/p2.png "$u2"
            verify /tmp/sipsik/p0.png "$h0"; verify /tmp/sipsik/p1.png "$h1"; verify /tmp/sipsik/p2.png "$h2"
            python3 /tmp/decode.py "src/assets/original-$n.jpg" "$size" "$sha" /tmp/sipsik/p0.png:16777216 /tmp/sipsik/p1.png:16777216 /tmp/sipsik/p2.png:"$len2"
            commit_one "src/assets/original-$n.jpg" "Add untouched Original spread $n"
          }

